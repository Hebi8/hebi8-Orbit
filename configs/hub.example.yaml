# Example hub configuration for hebi8-Orbit.
# Copy to ~/.config/hebi8-orbit/hub.yaml and replace placeholder values.
schemaVersion: 1
listenAddr: "127.0.0.1:4310"
dataDir: "~/.local/share/hebi8-orbit"
configDir: "~/.config/hebi8-orbit"

# Exact browser Origin served via tailscale serve (used for CSRF / CSWSH checks).
hubOrigin: "https://orbit.example.ts.net"

# Allowed Tailscale-User-Login identities (injected by tailscale serve).
allowedTailscaleLogins:
  - "user@example.com"

# Ryugi sidecar settings (black-box CLI bridge).
# When proxying via tailscale serve on a Tailnet host, set ryugiHost to the
# node's Tailscale IP and ryugiUrlHost to the MagicDNS host so Ryugi enables
# key-authenticated access and accepts the proxied Host header.
ryugiBin: "ryugi"
ryugiServerHome: "~/.local/share/hebi8-orbit/ryugi-home"
ryugiHost: "127.0.0.1"
ryugiUrlHost: ""
ryugiPort: 27319
ryugiPublicOrigin: "https://orbit.example.ts.net:8443"
ryugiPollIntervalSeconds: 6

# Local development overrides (loopback only; keep false in production).
devOpen: false
devToken: ""
